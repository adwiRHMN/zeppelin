<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>API Testing Kit</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>API Testing Kit</h1>
  <nav>
    <button data-tab="endpoints" class="active">Endpoints</button>
    <button data-tab="prompts">Prompts</button>
    <button data-tab="run">Run</button>
    <button data-tab="results">Results</button>
  </nav>
</header>

<main>

  <!-- ENDPOINTS -->
  <section id="tab-endpoints" class="tab active">
    <div class="panel">
      <h2>Add endpoint</h2>
      <div class="row">
        <div class="field"><label>Name</label><input id="ep-name" placeholder="OpenWebUI local"></div>
        <div class="field"><label>Base URL</label><input id="ep-url" placeholder="http://localhost:3000"></div>
        <div class="field">
          <label>Adapter</label>
          <select id="ep-adapter">
            <option value="openai_compat">OpenAI-compatible (OpenWebUI / v1)</option>
            <option value="ollama_native">Ollama native</option>
          </select>
        </div>
        <div class="field"><label>Model</label><input id="ep-model" placeholder="llama3.1:8b"></div>
        <div class="field"><label>API key (optional)</label><input id="ep-key" type="password"></div>
        <button class="primary" id="ep-add">Add</button>
      </div>
    </div>
    <div class="panel">
      <div class="toolbar"><h2>Endpoints</h2></div>
      <table>
        <thead><tr><th>Name</th><th>Base URL</th><th>Adapter</th><th>Model</th><th></th><th></th></tr></thead>
        <tbody id="ep-list"></tbody>
      </table>
    </div>
  </section>

  <!-- PROMPTS -->
  <section id="tab-prompts" class="tab">
    <div class="panel">
      <h2>Add prompt case</h2>
      <div class="row">
        <div class="field"><label>Name</label><input id="case-name" placeholder="short-factual"></div>
        <div class="field"><label>Temperature</label><input id="case-temp" type="number" step="0.1" value="0.7"></div>
        <div class="field"><label>Max tokens</label><input id="case-max-tokens" type="number" placeholder="(server default)"></div>
        <div class="field"><label>Seed</label><input id="case-seed" type="number" placeholder="(none)"></div>
      </div>
      <div class="row" style="margin-top:8px">
        <div class="field"><label>System prompt (optional)</label><textarea id="case-system"></textarea></div>
        <div class="field"><label>User prompt</label><textarea id="case-user"></textarea></div>
      </div>
      <div class="row" style="margin-top:8px"><button class="primary" id="case-add">Add case</button></div>
    </div>
    <div class="panel">
      <h2>Prompt cases</h2>
      <table>
        <thead><tr><th>Name</th><th>Prompt</th><th>Temp</th><th></th></tr></thead>
        <tbody id="case-list"></tbody>
      </table>
    </div>
  </section>

  <!-- RUN -->
  <section id="tab-run" class="tab">
    <div class="panel">
      <h2>Configure run</h2>
      <div class="row">
        <div class="field">
          <label>Endpoints</label>
          <div class="checklist" id="run-endpoints"></div>
        </div>
        <div class="field">
          <label>Prompt cases</label>
          <div class="checklist" id="run-cases"></div>
        </div>
      </div>
      <div class="row" style="margin-top:12px">
        <div class="field"><label>Repeats</label><input id="run-repeats" type="number" value="3" min="1" max="100"></div>
        <div class="field"><label>Delay between requests (s)</label><input id="run-delay" type="number" step="0.1" value="0"></div>
        <div class="field">
          <label>Warmup request</label>
          <select id="run-warmup"><option value="true" selected>Yes (excluded from stats)</option><option value="false">No</option></select>
        </div>
        <button class="primary" id="run-start">Start run</button>
      </div>
    </div>
    <div class="panel">
      <h2>Live progress</h2>
      <div id="run-log"></div>
    </div>
  </section>

  <!-- RESULTS -->
  <section id="tab-results" class="tab">
    <div class="panel">
      <div class="row">
        <div class="field">
          <label>Run</label>
          <select id="results-run"></select>
        </div>
        <button class="ghost" id="results-refresh">Refresh</button>
        <button class="ghost" id="results-export">Export CSV</button>
      </div>
    </div>
    <div class="panel">
      <h2>Summary (per endpoint × case)</h2>
      <table>
        <thead><tr>
          <th>Endpoint</th><th>Case</th><th>N</th><th>Errors</th>
          <th>TTFT p50</th><th>TTFT p95</th><th>Total p50</th><th>Total p95</th><th>Tok/s</th>
        </tr></thead>
        <tbody id="results-summary"></tbody>
      </table>
    </div>
    <div class="panel">
      <h2>Individual requests</h2>
      <table>
        <thead><tr>
          <th>#</th><th>Status</th><th>TTFT</th><th>Total</th><th>Tok/s</th><th>Rating</th><th></th>
        </tr></thead>
        <tbody id="results-detail"></tbody>
      </table>
    </div>
  </section>

</main>

<script src="/app.js"></script>
</body>
</html>
